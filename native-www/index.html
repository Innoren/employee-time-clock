<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Time Clock</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0a0a0a;
        color: #f4f4f5;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        border-radius: 16px;
        background: #f4f4f5;
        color: #0a0a0a;
        display: grid;
        place-items: center;
        font-weight: 700;
        letter-spacing: -1px;
      }
      p {
        max-width: 280px;
        margin: 8px auto 0;
        color: #a1a1aa;
        font-size: 14px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div class="mark">TC</div>
        <strong>Time Clock</strong>
        <p>
          Connecting to your workplace. Check that the phone can reach the Time
          Clock server, then reopen the app.
        </p>
      </div>
    </main>
  </body>
</html>
